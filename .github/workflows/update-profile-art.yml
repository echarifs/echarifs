name: Update profile art

# Refreshes the README cards daily from real contribution data (no auth needed):
# scrapes the public contributions page, re-renders every card SVG, commits.
"on":
  schedule:
    - cron: "23 6 * * *"   # ~06:23 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data (public endpoint, no token)
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repo cards, heatmap)
        run: python scripts/render_readme_cards.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
